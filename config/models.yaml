primary_algorithm: xgboost
challenger_scope: xgboost_variants_only
champion_promotion: stable_improvement_on_untouched_folds

xgboost_variants:
  - xgb_classifier
  - xgb_ranker
  - xgb_multiobjective
  - xgb_sector_specific
  - xgb_calibration_variant

suite:
  direction_classifier:
    type: multiclass
    classes: [up, neutral, down]
    objective: multi:softprob
    eval_metric: mlogloss

  ce_outcome:
    type: binary
    objective: binary:logistic
    eval_metric: aucpr

  pe_outcome:
    type: binary
    objective: binary:logistic
    eval_metric: aucpr

  spike_classifier:
    type: binary
    objective: binary:logistic
    eval_metric: aucpr

  mfe_regressor:
    type: regression
    objective: reg:squarederror
    eval_metric: rmse

  mae_regressor:
    type: regression
    objective: reg:squarederror
    eval_metric: rmse

  contract_ranker:
    type: ranker
    objective: rank:ndcg
    eval_metric: ndcg

tuning:
  framework: optuna
  sampler: tpe
  n_trials: [500, 2000]
  early_stopping: true
  stages:
    - structural: [max_depth, min_child_weight, gamma]
    - sampling: [subsample, colsample_bytree]
    - regularization: [reg_alpha, reg_lambda, max_delta_step]
    - learning: [learning_rate, n_estimators]

validation:
  primary: combinatorial_purged_cv
  inner_folds: purged_kfold
  outer_holdout: chronological
  purge_label_gap: 30  # minutes
  embargo_bars: 5
  cpcv_groups: 8
  cpcv_test_groups: 2

promotion_gates:
  leakage_suite: pass
  pbo: 0.25
  dsr_significant: true
  calibration_acceptable: true
  live_replay_parity: pass
  shadow_performance: pass
  no_single_stock_dependency: true
  no_single_month_dependency: true
